[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfforge"
version = "0.1.0"
description = "PDF manipulation from the terminal, from Python, or over MCP."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
keywords = ["pdf", "cli", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=5",
    "reportlab>=4",
]

[project.optional-dependencies]
test = [
    "numpy>=1.26",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/Alfredo-ctrl/pdfforge"
Repository = "https://github.com/Alfredo-ctrl/pdfforge"

[project.scripts]
pdfforge = "pdfforge.cli:main"

[tool.setuptools.packages.find]
include = ["pdfforge*"]
