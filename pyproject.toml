[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfforge"
version = "0.1.0"
description = "Professional PDF toolkit built for AI agents. CLI, Python API and MCP server."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5",
    "reportlab>=4",
]

[project.scripts]
pdfforge = "pdfforge.cli:main"

[tool.setuptools.packages.find]
include = ["pdfforge*"]
